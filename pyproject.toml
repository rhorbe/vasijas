[project]
name = "vasijas"
authors = [{name = "Rafael Orbe", email = "rafaelorbe@outlook.com"}]
version = "0.1.0"
description = "Proyecto de Tesis - Vasijas"

requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "load-dotenv>=0.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pandas-stubs~=3.0.0",
    "scipy>=1.17.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest"
]
